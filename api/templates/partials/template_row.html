<section class="card"
         x-data="{ open: false }"
         id="template-{{ tpl.id }}">
    <div class="flex items-center justify-between gap-3">
        <button type="button" @click="open = !open" class="flex-1 min-h-11 flex items-center gap-3 text-left">
            <svg class="w-4 h-4 text-zinc-500 transition-transform duration-200 shrink-0"
                 :class="open && 'rotate-90'" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 3.5 10.5 8 6 12.5"/>
            </svg>
            <span class="font-semibold text-zinc-100">{{ tpl.name }}</span>
            <span class="text-sm text-zinc-500">{{ tpl.item_count }} Element{% if tpl.item_count != 1 %}e{% endif %}</span>
        </button>
        <button type="button"
                hx-post="/api/checklists/activate/{{ tpl.id }}"
                hx-swap="none"
                class="btn min-h-10 px-4 text-sm bg-emerald-600 text-white hover:bg-emerald-500">
            {{ t("Aktivieren") }}
        </button>
    </div>

    <!-- Items list (toggle via Alpine) -->
    <div x-show="open" x-cloak class="mt-4 border-t border-white/5 pt-4">
        <ul id="items-{{ tpl.id }}" class="flex flex-col gap-1.5 mb-3">
            {% for item in tpl.item_list %}
            <li class="flex items-center gap-2 rounded-xl bg-white/[0.03] pl-4 pr-1.5 py-1.5">
                <span class="flex-1 text-sm text-zinc-200">{{ item.text }}</span>
                <button type="button"
                        hx-post="/api/checklists/items/{{ item.id }}/move"
                        hx-vals='{"direction": "up"}'
                        hx-target="#template-{{ tpl.id }}"
                        hx-swap="outerHTML"
                        class="w-10 h-10 flex items-center justify-center rounded-lg text-zinc-500
                               hover:bg-white/[0.06] hover:text-zinc-100 active:scale-95 transition"
                        title="{{ t('Nach oben') }}">
                    ↑
                </button>
                <button type="button"
                        hx-post="/api/checklists/items/{{ item.id }}/move"
                        hx-vals='{"direction": "down"}'
                        hx-target="#template-{{ tpl.id }}"
                        hx-swap="outerHTML"
                        class="w-10 h-10 flex items-center justify-center rounded-lg text-zinc-500
                               hover:bg-white/[0.06] hover:text-zinc-100 active:scale-95 transition"
                        title="{{ t('Nach unten') }}">
                    ↓
                </button>
                <button type="button"
                        hx-delete="/api/checklists/items/{{ item.id }}"
                        hx-target="#template-{{ tpl.id }}"
                        hx-swap="outerHTML"
                        hx-confirm="{{ t('Element löschen?') }}"
                        class="w-10 h-10 flex items-center justify-center rounded-lg text-red-400/80
                               hover:bg-red-500/10 hover:text-red-400 active:scale-95 transition"
                        title="{{ t('Löschen') }}">
                    ✕
                </button>
            </li>
            {% endfor %}
        </ul>

        <!-- Add item form -->
        <form hx-post="/api/checklists/{{ tpl.id }}/items"
              hx-target="#items-{{ tpl.id }}"
              hx-swap="beforeend"
              class="flex items-center gap-2">
            <input
                type="text"
                name="text"
                placeholder="{{ t('Neues Element') }}"
                required
                class="field flex-1 text-sm">
            <button type="submit" class="btn min-h-11 px-4 text-sm bg-white/[0.08] text-zinc-100 hover:bg-white/[0.12]">
                {{ t("Hinzufügen") }}
            </button>
        </form>
    </div>
</section>
