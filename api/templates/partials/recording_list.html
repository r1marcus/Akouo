{% if recordings %}
<ul class="grid gap-3 sm:grid-cols-2">
    {% for rec in recordings %}
    <li class="card p-4">
        <div class="flex justify-between items-baseline gap-3 mb-3">
            <span class="font-medium text-zinc-100 truncate">{{ rec.filename }}</span>
            <span class="text-xs text-zinc-500 font-mono tabular-nums shrink-0">
                {{ rec.date }}{% if rec.duration %} · {{ rec.duration }}s{% endif %}
            </span>
        </div>
        <audio controls class="w-full h-10"
               src="/recordings/{{ rec.date[:4] }}/{{ rec.date[5:7] }}/{{ rec.filename }}">
        </audio>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="text-sm text-zinc-500">Noch keine Aufnahmen vorhanden.</p>
{% endif %}
